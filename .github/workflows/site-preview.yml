name: Unpublished site preview

on:
  pull_request:
    paths:
      - "site/**"
      - "packages/game-engine/src/scoring.ts"
      - "packages/ui/src/assets/**"
      - ".github/workflows/site-preview.yml"
      - "bun.lock"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "packages/game-engine/src/scoring.ts"
      - "packages/ui/src/assets/**"
      - ".github/workflows/site-preview.yml"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Validate unpublished pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node --test site/*.test.mjs
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - run: node site/browser.mjs reports/site-preview-ci
      - name: Retain unpublished preview and rendered evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unpublished-site-${{ github.event.pull_request.head.sha || github.sha }}
          path: reports/site-preview-ci
          if-no-files-found: error
          retention-days: 1
